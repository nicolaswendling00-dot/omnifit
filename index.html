<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="OmniFit — Suivi fitness complet : poids, nutrition, entraînement, activité.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Barre de statut OPAQUE (et non black-translucent) : depuis iOS 26, une app
       installée en black-translucent est dimensionnée à la hauteur « sûre » mais
       collée en haut de l'écran, ce qui laisse en bas une bande morte de la
       hauteur de la barre de statut (~1 cm), hors de la vue web. En opaque, iOS
       réserve sa propre bande en haut et la vue web descend jusqu'au bord bas.
       Sur fond noir, la différence est invisible en haut. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmniFit">
  <title>OmniFit</title>
  <link rel="manifest" href="./assets/manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo : grotesque à largeur variable (axe wdth), proche de la typographie
       de l'Esports World Cup. Les chiffres et titres sont composés en « élargi ». -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Écran de lancement : une flèche part du coin bas gauche, trace la ligne,
       fait la boucle de l'infini et ressort en haut à droite. L'écran s'ouvre
       ensuite en deux le long de ce trait (bleu vers le haut, violet vers le bas). -->
  <div id="splash" aria-hidden="true"></div>
  <script>
  (function () {
    var s = document.getElementById('splash');
    var W = innerWidth, H = innerHeight, k = Math.min(W, H) * 0.6 / 75;
    var ux = 27 / 37.48, uy = -26 / 37.48, nx = -26 / 37.48, ny = -27 / 37.48;
    // du croisement au bord de l'écran, plus la taille de la flèche (unités du logo)
    var e = Math.min(W / 2 / ux, H / 2 / -uy) / k + 20;
    var pt = function (d) { return (50 + ux * d) + ' ' + (55 + uy * d); };
    // Un seul trait : ligne, boucle de droite, boucle de gauche, ligne
    var d = 'M' + pt(-e) + ' L50 55'
      + ' C58 46 64 40 72 40 C81 40 87 47 87 55 C87 63 81 70 72 70 C64 70 58 64 50 55'
      + ' C42 46 36 40 28 40 C19 40 13 47 13 55 C13 63 19 70 28 70 C36 70 42 63 50 55'
      + ' L' + pt(e);
    var g = 'translate(' + W / 2 + ' ' + H / 2 + ') scale(' + k + ') translate(-50 -55)';
    var svg = function (tip) {
      return '<svg viewBox="0 0 ' + W + ' ' + H + '"><g transform="' + g + '" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">'
        + '<path class="sp-path" stroke-width="9" d="' + d + '"/>'
        + (tip ? '<path class="sp-tip" fill="#fff" stroke-width="4" d="M7 0 L-9 -8.5 L-9 8.5 Z"/>' : '') + '</g></svg>';
    };
    var L = 2 * (W + H);
    // Ciel étoilé comme sur l'icône, tiré une fois (graine fixe : le même à chaque lancement)
    var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var stars = '';
    for (var i = 0, n = Math.round(W * H / 2600); i < n; i++) {
      stars += '<circle cx="' + (rnd() * W).toFixed(1) + '" cy="' + (rnd() * H).toFixed(1) + '" r="' + (0.6 + rnd() * rnd() * 2).toFixed(2) + '" opacity="' + (0.4 + rnd() * 0.6).toFixed(2) + '"/>';
    }
    var sky = '<svg class="sp-sky" viewBox="0 0 ' + W + ' ' + H + '" fill="#fff">' + stars + '</svg>';
    // les moitiés se chevauchent d'1 px : pas de fente visible le long de la coupe
    [1, -1].forEach(function (side) {
      var p = function (a, b) { return (W / 2 + ux * a + nx * b * side) + 'px ' + (H / 2 + uy * a + ny * b * side) + 'px'; };
      var h = document.createElement('div');
      h.className = 'sp-half';
      h.style.clipPath = 'polygon(' + [p(-L, -1), p(L, -1), p(L, L), p(-L, L)].join(',') + ')';
      h.style.setProperty('--out', 'translate3d(' + nx * side * H * 0.7 + 'px,' + ny * side * H * 0.7 + 'px,0)');
      h.innerHTML = sky + svg(false);
      s.appendChild(h);
    });
    // Le tracé animé, par dessus les deux moitiés (déjà complètes en dessous)
    var top = document.createElement('div');
    top.className = 'sp-top';
    top.innerHTML = svg(true);
    s.appendChild(top);
    var path = top.querySelector('.sp-path'), tip = top.querySelector('.sp-tip');
    var len = path.getTotalLength();
    path.style.strokeDasharray = len + ' ' + (len + 20);
    var draw = function (p) {
      var at = p * len, a = path.getPointAtLength(at), b = path.getPointAtLength(Math.min(len, at + 0.5));
      var c = at + 0.5 > len ? path.getPointAtLength(at - 0.5) : a;
      var ang = at + 0.5 > len ? Math.atan2(a.y - c.y, a.x - c.x) : Math.atan2(b.y - a.y, b.x - a.x);
      path.style.strokeDashoffset = String(len - at);
      tip.setAttribute('transform', 'translate(' + a.x + ' ' + a.y + ') rotate(' + ang * 180 / Math.PI + ')');
    };
    var drawn = false, ready = false, done = false;
    var open = function () {
      if (done) return; done = true;
      s.classList.add('open');
      setTimeout(function () { s.remove(); }, 650);
    };
    var maybe = function () { if (drawn && ready) open(); };
    var finish = function () { drawn = true; setTimeout(maybe, 60); };
    var DUR = 1300, t0 = 0;
    var ease = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
    var frame = function (now) {
      if (!t0) t0 = now;
      var x = Math.min(1, (now - t0) / DUR);
      draw(ease(x));
      if (x < 1) requestAnimationFrame(frame); else finish();
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(1); finish(); }
    else { draw(0); requestAnimationFrame(frame); }
    window.omnifitReady = function () { ready = true; maybe(); };
    setTimeout(open, 5500);               // filet : l'appli ne doit jamais rester cachée
    s.addEventListener('click', open);
  })();
  </script>

  <div id="app-container">
    <div class="page" id="page-home"></div>
    <div class="page" id="page-nutrition"></div>
    <div class="page" id="page-workout"></div>
    <div class="page" id="page-activity"></div>
    <div class="page" id="page-settings"></div>
  </div>

  <nav id="bottom-nav" aria-label="Navigation principale">
    <button class="nav-btn active" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M4 10.4 12 4l8 6.4V19a1.5 1.5 0 0 1-1.5 1.5H15V15H9v5.5H5.5A1.5 1.5 0 0 1 4 19Z"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-btn" aria-label="Nutrition">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M12 8.2c-1.6-1.3-5.6-1.5-6.9 1.9-1.3 3.4.8 9.1 3.4 10.4 1.3.7 2.3.1 3.5.1s2.2.6 3.5-.1c2.6-1.3 4.7-7 3.4-10.4-1.3-3.4-5.3-3.2-6.9-1.9Z"/><path d="M12 8.2c0-2.2.9-3.6 2.8-4.4"/></svg>
      <span>Nutrition</span>
    </button>
    <button class="nav-btn" aria-label="Entraînement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="f" x="2.5" y="9" width="3" height="6" rx="1"/><rect class="f" x="5.5" y="6.5" width="3.2" height="11" rx="1.2"/><rect class="f" x="15.3" y="6.5" width="3.2" height="11" rx="1.2"/><rect class="f" x="18.5" y="9" width="3" height="6" rx="1"/><path d="M8.7 12h6.6"/></svg>
      <span>Entraînement</span>
    </button>
    <button class="nav-btn" aria-label="Activité">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M8 3.5c1.8 0 3 2 3 4.6 0 2.2-.8 3.3-.8 4.9H5.8c0-1.6-.8-2.7-.8-4.9C5 5.5 6.2 3.5 8 3.5Z"/><path class="f" d="M5.9 15.5h4.2v1.2a2.1 2.1 0 0 1-4.2 0Z"/><path class="f" d="M16 7c1.8 0 3 2 3 4.6 0 2.2-.8 3.3-.8 4.9h-4.4c0-1.6-.8-2.7-.8-4.9C13 9 14.2 7 16 7Z"/><path class="f" d="M13.9 19h4.2v.2a2.1 2.1 0 0 1-4.2 0Z"/></svg>
      <span>Activité</span>
    </button>
    <button class="nav-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle class="f" cx="15" cy="7" r="2.5"/><circle class="f" cx="9" cy="17" r="2.5"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <script type="module" src="./app.js"></script>
</body>
</html>
