<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="OmniFit — Suivi fitness complet : poids, nutrition, entraînement, activité.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Barre de statut OPAQUE (et non black-translucent) : depuis iOS 26, une app
       installée en black-translucent est dimensionnée à la hauteur « sûre » mais
       collée en haut de l'écran, ce qui laisse en bas une bande morte de la
       hauteur de la barre de statut (~1 cm), hors de la vue web. En opaque, iOS
       réserve sa propre bande en haut et la vue web descend jusqu'au bord bas.
       Sur fond noir, la différence est invisible en haut. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmniFit">
  <title>OmniFit</title>
  <link rel="manifest" href="./assets/manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo : grotesque à largeur variable (axe wdth), proche de la typographie
       de l'Esports World Cup. Les chiffres et titres sont composés en « élargi ». -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body>

  <div id="app-container">
    <div class="page" id="page-home"></div>
    <div class="page" id="page-nutrition"></div>
    <div class="page" id="page-workout"></div>
    <div class="page" id="page-activity"></div>
    <div class="page" id="page-settings"></div>
  </div>

  <nav id="bottom-nav" aria-label="Navigation principale">
    <button class="nav-btn active" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M4 10.4 12 4l8 6.4V19a1.5 1.5 0 0 1-1.5 1.5H15V15H9v5.5H5.5A1.5 1.5 0 0 1 4 19Z"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-btn" aria-label="Nutrition">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M12 8.2c-1.6-1.3-5.6-1.5-6.9 1.9-1.3 3.4.8 9.1 3.4 10.4 1.3.7 2.3.1 3.5.1s2.2.6 3.5-.1c2.6-1.3 4.7-7 3.4-10.4-1.3-3.4-5.3-3.2-6.9-1.9Z"/><path d="M12 8.2c0-2.2.9-3.6 2.8-4.4"/></svg>
      <span>Nutrition</span>
    </button>
    <button class="nav-btn" aria-label="Entraînement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="f" x="2.5" y="9" width="3" height="6" rx="1"/><rect class="f" x="5.5" y="6.5" width="3.2" height="11" rx="1.2"/><rect class="f" x="15.3" y="6.5" width="3.2" height="11" rx="1.2"/><rect class="f" x="18.5" y="9" width="3" height="6" rx="1"/><path d="M8.7 12h6.6"/></svg>
      <span>Entraînement</span>
    </button>
    <button class="nav-btn" aria-label="Activité">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f" d="M8 3.5c1.8 0 3 2 3 4.6 0 2.2-.8 3.3-.8 4.9H5.8c0-1.6-.8-2.7-.8-4.9C5 5.5 6.2 3.5 8 3.5Z"/><path class="f" d="M5.9 15.5h4.2v1.2a2.1 2.1 0 0 1-4.2 0Z"/><path class="f" d="M16 7c1.8 0 3 2 3 4.6 0 2.2-.8 3.3-.8 4.9h-4.4c0-1.6-.8-2.7-.8-4.9C13 9 14.2 7 16 7Z"/><path class="f" d="M13.9 19h4.2v.2a2.1 2.1 0 0 1-4.2 0Z"/></svg>
      <span>Activité</span>
    </button>
    <button class="nav-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle class="f" cx="15" cy="7" r="2.5"/><circle class="f" cx="9" cy="17" r="2.5"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <script type="module" src="./app.js"></script>
</body>
</html>
